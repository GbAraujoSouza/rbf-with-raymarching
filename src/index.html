<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>WebGPU Starter</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <canvas id="gpu-canvas"></canvas>
        <aside id="rbf-distance-panel" class="analysis-panel">
            <div class="analysis-header">
                <h2>RBF Distance Approximation</h2>
                <div id="rbf-distance-status">Waiting for RBF data...</div>
            </div>
            <div class="analysis-chart-container">
                <canvas
                    id="rbf-distance-plot"
                    aria-label="Scatter plot comparing absolute RBF values with sampled zero-set distances"
                ></canvas>
            </div>
            <p class="analysis-caption">
                |RBF| × sampled zero-set distance
            </p>
        </aside>
        <div id="config-modal" class="config-modal">
            <div class="modal-header">
                <h2>Experiment Config</h2>
                <div class="fps-badge"><span id="fps-counter">0</span> FPS</div>
            </div>

            <div class="modal-section">
                <h3>Rendering Options</h3>
                <div class="control-group">
                    <label>Render Backend</label>
                    <select id="sel-render-backend">
                        <option value="rayMarching">Ray Marching</option>
                        <option value="marchingCubes" selected>
                            Marching Cubes
                        </option>
                    </select>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="chk-control-points" checked />
                    Show Control Points
                </label>
                <label class="heatmap-label">
                    <input type="checkbox" id="chk-heat-map" checked />
                    Steps HeatMap
                </label>
            </div>

            <div class="modal-section">
                <h3>Ray Marching</h3>
                <div class="control-group">
                    <label>Strategy</label>
                    <select id="sel-strategy">
                        <option value="naive">Naive</option>
                        <option value="exponentialCorrection" selected>
                            Exponential Correction
                        </option>
                        <option value="gradient">Gradient</option>
                        <option value="cellLocalLipschitz">
                            Cell-Local Lipschitz
                        </option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Kernel</label>
                    <select id="sel-kernel">
                        <option value="linear" selected>Linear</option>
                        <option value="gaussian">Gaussian</option>
                        <option value="cubic">Cubic</option>
                        <option value="quintic">Quintic</option>
                        <option value="thinPlate">Thin Plate</option>
                    </select>
                </div>
                <div class="control-group">
                    <label
                        >Epsilon
                        <span class="val-display" id="val-rm-epsilon"
                            >1e-5</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rm-epsilon"
                        min="0.000001"
                        max="0.001"
                        step="0.000001"
                        value="0.00001"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Max Distance
                        <span class="val-display" id="val-rm-maxdist"
                            >20</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rm-maxdist"
                        min="1"
                        max="100"
                        step="1"
                        value="20"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Max Steps
                        <span class="val-display" id="val-rm-maxsteps"
                            >255</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rm-maxsteps"
                        min="0"
                        max="1000"
                        step="1"
                        value="255"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Corr Linear
                        <span class="val-display" id="val-rm-corlinear"
                            >0.9</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rm-corlinear"
                        min="0"
                        max="2"
                        step="0.01"
                        value="0.9"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Corr Power
                        <span class="val-display" id="val-rm-corpower"
                            >0.85</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rm-corpower"
                        min="0"
                        max="2"
                        step="0.01"
                        value="0.85"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Lipschitz Grid Resolution
                        <span
                            class="val-display"
                            id="val-rm-lipschitz-resolution"
                            >8</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rm-lipschitz-resolution"
                        min="4"
                        max="32"
                        step="1"
                        value="8"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Gradient Samples Per Axis
                        <span
                            class="val-display"
                            id="val-rm-lipschitz-samples"
                            >3</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rm-lipschitz-samples"
                        min="2"
                        max="5"
                        step="1"
                        value="3"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Lipschitz Safety Factor
                        <span
                            class="val-display"
                            id="val-rm-lipschitz-safety"
                            >1.2</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rm-lipschitz-safety"
                        min="1"
                        max="2"
                        step="0.05"
                        value="1.2"
                    />
                </div>
                <button id="btn-apply-lipschitz" class="btn-primary">
                    Apply Lipschitz Grid
                </button>
            </div>

            <div class="modal-section">
                <h3>RBF Config</h3>
                <div class="control-group">
                    <label>Scene</label>
                    <select id="sel-scene">
                        <option value="sphere">Sphere</option>
                        <option value="torus" selected>Torus</option>
                        <option value="dragon">Dragon</option>
                        <option value="bunny">Bunny</option>
                        <option value="buddha">Buddha</option>
                        <option value="teapot">Teapot</option>
                    </select>
                </div>
                <div class="control-group">
                    <label
                        >Surface Samples
                        <span class="val-display" id="val-rbf-samples"
                            >32</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rbf-samples"
                        min="8"
                        max="2000"
                        step="1"
                        value="32"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Gaussian Epsilon
                        <span class="val-display" id="val-rbf-gEpsilon"
                            >1.35</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rbf-gEpsilon"
                        min="0.1"
                        max="5.0"
                        step="0.01"
                        value="1.35"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Sphere Radius
                        <span class="val-display" id="val-rbf-radius"
                            >1</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rbf-radius"
                        min="0.1"
                        max="5.0"
                        step="0.1"
                        value="1.0"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Debug Radius
                        <span class="val-display" id="val-rbf-debugRadius"
                            >0.06</span
                        ></label
                    >
                    <input
                        type="range"
                        id="rng-rbf-debugRadius"
                        min="0.01"
                        max="0.5"
                        step="0.01"
                        value="0.06"
                    />
                </div>
                <div class="control-group">
                    <label
                        >Normal offset
                        <span id="val-rbf-offset" class="val-display"></span>
                    </label>
                    <input
                        type="range"
                        id="rng-rbf-offset"
                        min="0"
                        max="0.5"
                        step="0.01"
                    />
                </div>
                <div class="control-group">
                    <label>
                        Regularization
                        <span
                            id="val-rbf-regularization"
                            class="val-display"
                        ></span>
                    </label>
                    <input
                        type="range"
                        id="rng-rbf-regularization"
                        min="0"
                        max="0.01"
                        step="0.0001"
                    />
                </div>
                <button id="btn-apply-rbf" class="btn-primary">
                    Apply RBF Config
                </button>
            </div>
        </div>
    </body>
</html>
